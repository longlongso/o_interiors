<script>
    $(function() {
		$('.ms_item .edit').click(function(){
			$('.ms_item .add_new').remove();
			$(this).parent().parent().find('.date-range').removeAttr('disabled');
			$(this).parent().parent().find('select[name="membership[type]"]').removeAttr('disabled');
			return false;
		});
		$('.ms_item .add').click(function(){
			//$(this).parent().parent().find('input[name="membership[id]"]').remove();
			//$(this).parent().parent().find('.date-range').removeAttr('disabled').val('');
			if($('.ms_item .add_new').length){
				return false;
			}
			var html = '';
			html +='<div class="date-range-tool add_new" style="border: 1px solid #ccc; padding: 5px 10px;">';
			html +='<input type="hidden" name="membership[id]" value=""/>';
			html +='	<label class="inblock"> From ';
			html +='	<input class="date-range" data-range="from" type="text" name="membership[from]" value=""/>';
			html +='	</label>';
			html +='	<label class="inblock"> To ';
			html +='	  <input class="date-range" data-range="to" type="text" name="membership[to]" value=""/>';
			html +='	</label> ';
			
			html +='<label class="inblock">';
			html +='  Type ';
			html +='  <select name="membership[type]">';
			html +='	<option value="">--</option>';
			html +='	<option value="R">Regular</option>';
			html +='	<option value="E">Extended</option>';
			html +='	<option value="P">Passed</option>';
			html +='	<option value="X">NonStuden</option>';
			html +='	<option value="W">Website</option>';
			html +='	<option value="S">Special</option>';
			html +='	<option value="F">Free Seminar</option>';
			html +='  </select>';	
			html +='</label>';
			
			html +='</div>';
			$('.ms_item .add_new').remove();
			$('.ms_item .add').before(html);
			return false;
		});
		$('.history_member_ship').appendTo('#membershipHistoryCon');
		var m_to = $('input[name="membership[to]"]').val();
		var m_h = $('input[name="membership[to]"]').data('h');
		if(m_to && !m_h){
			$('#m_membership_expiry_date').text(m_to);
			
			if( Date.parse( new Date(m_to) ) - 2592000000 < Date.parse( new Date() ) ){
				$('#m_membership_status').html('<i style="color:#ff9800;font-size: 20px;" class="fa fa-lightbulb-o" aria-hidden="true"></i> Yes *');
			}else{
				$('#m_membership_status').html('<i style="color:#4CAF50;font-size: 20px;" class="fa fa-lightbulb-o" aria-hidden="true"></i> Yes');
			}
		}else if(m_h){
			$('#m_membership_expiry_date').text('{$Think.lang.expired}');
			$('#m_membership_status').html('<i style="color:#F44336;font-size: 20px;" class="fa fa-lightbulb-o" aria-hidden="true"></i> No');
		}
		setTimeout(function(){
			var v = $('select[name="membership[type]"]').val();
			var t = $('select[name="membership[type]"]').find('option[value="'+ v +'"]').text();
			var c = '';
			if(v == 'R' || v == 'E'){
				var c = $('#m_membership_type').data('course-count');
			}
			$('#m_membership_type').text(t+c);
		},100);
		
		$('.ms_item .inblock').click(function(){
			//return false;
		});
		
		
		// Chegue iamge upload
		
	});
</script>
