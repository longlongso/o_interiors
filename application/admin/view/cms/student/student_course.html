			var d_str = $(this).val();

				var d_arr = d_str.split('-');
				if(d_arr.length == 3){
					var y = d_arr[0];
					if(d_arr[2] == '01'){
						
						var m = parseInt(d_arr[1]) + 5;
						if(m == 6 || m == 9 || m == 11 || m == 16){
							var d = '30';
						}else if(m == 7 || m == 8 || m == 10 || m==12 || m == 13 || m == 15 || m == 17){
							var d = '31';
						}else if(m == 14){
							if((y % 4 == 0) && (y % 100 != 0 || y % 400 == 0)){
								var d = '29';
							}else{
								var d = '28';
							}
						}
						
					}else{
						var m = parseInt(d_arr[1]) + 6;
						var d = parseInt(d_arr[2]) - 1;
					}
					
					n_str = y + '-' + (m.length==1?'0'+m:m) + '-' + (d.length==1?'0'+d:d);
					$('input[name="new_course[expiry_date]"]').val(n_str).trigger('change');

			}
		});

	function create_payment_code(n){
		if(!n){
			if($('#panel_edit_course input[name="edit_course[payment_code]"]').val()){
				alert('can not change');
				return false;
			}
		}else{
			if($('#panel_new_course input[name="new_course[payment_code]"]').val()){
				alert('can not change');
				return false;
			}
		}
		
		$.get("{:url('create_payment_code')}", function(res){
			if(n){
				//new
				$('#new_payment_code').val(res);
				$('#panel_new_course input[name="new_course[payment_code]"]').val(res);
			}else{
				// edit
				$('#edit_payment_code').val(res);
				$('#panel_edit_course input[name="edit_course[payment_code]"]').val(res);
			}
		});
		
		return false;
	}
